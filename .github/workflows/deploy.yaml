name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        run: |
          aws sts get-caller-identity

      - name: Deploy Container & Serverless Update
        run: |
          echo "Deploying application update..."

      - name: Deploy Frontend to Amplify
        run: |
          zip -j frontend.zip frontend/index.html
          RESPONSE=$(aws amplify create-deployment --app-id d38cefoltpwnw0 --branch-name main --region us-west-2)
          JOB_ID=$(echo $RESPONSE | jq -r '.jobId')
          UPLOAD_URL=$(echo $RESPONSE | jq -r '.zipUploadUrl')
          curl -H "Content-Type: application/zip" --upload-file frontend.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id d38cefoltpwnw0 --branch-name main --job-id $JOB_ID --region us-west-2
